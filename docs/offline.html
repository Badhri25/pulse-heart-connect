<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PulsePod • Offline</title>
  <link rel="icon" href="/favicon.png" />
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; background: #0a0a0a; color: #f5f5f5; min-height:100vh; display:grid; place-items:center; }
    .card { border:1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); border-radius: 16px; padding: 28px; max-width: 520px; margin: 24px; text-align: center; }
    .title { font-size: 28px; font-weight: 700; margin: 0 0 8px; background: linear-gradient(90deg, #ff5c8d, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .muted { color: rgba(255,255,255,0.7); font-size: 15px; }
    .row { display:flex; align-items:center; gap:10px; justify-content:center; margin-top: 14px; color: rgba(255,255,255,0.8); font-size: 14px; }
    .btn { display:inline-flex; align-items:center; gap:8px; margin-top:18px; padding:10px 14px; border-radius:999px; background:#111; color:#fff; border:1px solid rgba(255,255,255,0.12); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/favicon.png" alt="PulsePod" width="40" height="40" style="border-radius:8px;border:1px solid rgba(255,255,255,0.15);margin-bottom:10px" />
    <h1 class="title">You’re offline</h1>
    <p class="muted">We couldn’t reach PulsePod. Check your connection and try again.
    <div class="row">Pulses and history sync when you’re back online.</div>
    <a class="btn" href="/">Retry</a>
  </div>
</body>
</html>
